<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Fit Scorer</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
    }
    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: var(--text);
      width: 320px;
      background: var(--bg);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title-group h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .title-group p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted);
    }
    .card {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .score-badge {
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .tier-HIGH { background: #059669; color: #fff; }
    .tier-MID { background: #d97706; color: #fff; }
    .tier-LOW { background: #4b5563; color: #fff; }
    .tier-SKIP, .tier-AUTO-LOW, .tier-EXCLUDE { background: #dc2626; color: #fff; }

    .score-number {
      font-size: 24px;
      font-weight: 800;
    }
    .meta-title {
      font-weight: 600;
      font-size: 13px;
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 7px 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
      margin-top: 6px;
    }
    .btn-secondary {
      background: #fff;
      border: 1px solid #d1d5db;
      color: #374151;
    }
    .btn:hover {
      opacity: 0.9;
    }
    details {
      margin-top: 10px;
      font-size: 12px;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: #4b5563;
      user-select: none;
    }
    .field-label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .field {
      width: 100%;
      box-sizing: border-box;
      margin-top: 3px;
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
    }
    .profile-list {
      margin: 8px 0 0;
      padding-left: 18px;
      color: #4b5563;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h1>Job Fit Scorer</h1>
      <p id="profile-line"></p>
    </div>
  </div>

  <div class="card" id="status-card">
    <div class="score-row">
      <span class="score-badge tier-LOW" id="badge">IDLE</span>
      <span class="score-number" id="score">--</span>
    </div>
    <div class="meta-title" id="page-title">Detecting job posting...</div>
    <div class="meta-sub" id="page-meta">Navigate to a job post to evaluate</div>
  </div>

  <button class="btn" id="score-btn">🔄 Score Current Tab</button>
  <button class="btn btn-secondary" id="tracker-btn">📊 Open Job Tracker Sheet</button>

  <details id="tracker-settings">
    <summary>Tracker logging setup</summary>
    <label class="field-label" for="tracker-sheet">Tracker sheet URL (for the Open button)</label>
    <input class="field" id="tracker-sheet" type="url" placeholder="https://docs.google.com/spreadsheets/d/.../edit">
    <label class="field-label" for="tracker-url">Apps Script web app URL</label>
    <input class="field" id="tracker-url" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label class="field-label" for="tracker-token">Token (same as script property JFO_TOKEN)</label>
    <input class="field" id="tracker-token" type="password" autocomplete="off">
    <button class="btn btn-secondary" id="tracker-save">Save</button>
    <div class="meta-sub" id="tracker-status"></div>
  </details>

  <details>
    <summary>Profile & Standing Rules</summary>
    <ul class="profile-list" id="profile-list"></ul>
  </details>

  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
